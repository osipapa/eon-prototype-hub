<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Eon Design Hub</title>
  <style>
    .orbit {
      transform-box: view-box;
      transform-origin: 32px 32px;
      animation: orbit 8s linear infinite;
    }
    @keyframes orbit { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .orbit { animation: none; }
    }
  </style>
  <rect width="64" height="64" rx="16" fill="#121216"/>
  <circle cx="32" cy="32" r="22" fill="none" stroke="#FFFFFF" stroke-width="6"/>
  <path class="orbit" d="M32 10a22 22 0 0 1 0 44" fill="none" stroke="#EDD2F6" stroke-width="6" stroke-linecap="round"/>
</svg>
